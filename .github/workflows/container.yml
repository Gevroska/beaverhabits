name: Build fork container

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.repository == 'Gevroska/beaverhabits'
    uses: ./.github/workflows/pre-deployment-test.yml

  container:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare image identity
        env:
          REVISION: ${{ github.sha }}
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${REVISION}" >> "$GITHUB_ENV"
          printf 'IDENTITY = "beaverhabits/fork@%s"\n' "$REVISION" > beaverhabits/version.py
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the production image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=BSD-3-Clause
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
        with:
          version: "0.13.0"
          python-version: "3.14"
      - name: Smoke-test login, data, and restart persistence
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          uv sync --locked --no-dev --no-install-project
          docker run -d --name beaverhabits-smoke --memory=512m --cpus=1 \
            -p 127.0.0.1:18080:8080 -e HABITS_STORAGE=DATABASE -e MAX_USER_COUNT=1 "$IMAGE"
          uv run --no-sync python tests/smoke_container.py seed
          docker restart --timeout 30 beaverhabits-smoke
          uv run --no-sync python tests/smoke_container.py verify
      - name: Container diagnostics
        if: always()
        run: docker logs beaverhabits-smoke || true
      - name: Remove disposable test container
        if: always()
        run: docker rm -f beaverhabits-smoke || true
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        run: |
          docker push "$IMAGE"
          DIGEST=$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')
          printf '### Tested container\n\n`%s`\n\nDeploy this digest only after review.\n' "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
